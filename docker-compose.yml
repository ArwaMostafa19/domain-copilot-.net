services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "18080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://copilot_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}}
      AUTH_SECRET: ${AUTH_SECRET:-}
      LLM_CHAIN: ${LLM_CHAIN:-groq,gemini,ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_STREAM_USAGE: ${GROQ_STREAM_USAGE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_STREAM_USAGE: ${GEMINI_STREAM_USAGE:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_COOLDOWN_SECONDS: ${LLM_COOLDOWN_SECONDS:-60}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.55}
      RUN_MAX_MODEL_CALLS: ${RUN_MAX_MODEL_CALLS:-6}
      RUN_TOKEN_BUDGET: ${RUN_TOKEN_BUDGET:-20000}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-120}
      RUN_STEP_TIMEOUT_SECONDS: ${RUN_STEP_TIMEOUT_SECONDS:-45}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_INGEST_FILE_BYTES: ${MAX_INGEST_FILE_BYTES:-10485760}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./corpus:/app/corpus:ro
      - ./eval:/app/eval
    # API startup does not run migrations or seed users; those remain explicit CLI operations.

volumes:
  pgdata:


