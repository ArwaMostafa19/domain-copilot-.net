name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password # gitleaks:allow
          POSTGRES_DB: domaincopilot_phase4_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d domaincopilot_phase4_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOMAINCOPILOT_RUN_DISPOSABLE_DB_TESTS: "1"
      DOMAINCOPILOT_DISPOSABLE_ADMIN_DATABASE_URL: postgresql://ci_admin:ci_password@localhost:5432/domaincopilot_phase4_disposable # gitleaks:allow
      DOMAINCOPILOT_DISPOSABLE_APP_DB_PASSWORD: ci_app_password # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build Release solution
        run: dotnet build DomainCopilot.sln --configuration Release
      - name: Run Domain tests
        run: dotnet run --project tests/DomainCopilot.DomainTests --configuration Release --no-build
      - name: Run Application tests
        run: dotnet run --project tests/DomainCopilot.ApplicationTests --configuration Release --no-build
      - name: Run Infrastructure tests (including isolated PostgreSQL suite)
        run: dotnet run --project tests/DomainCopilot.InfrastructureTests --configuration Release --no-build
      - name: Run API tests
        run: dotnet run --project tests/DomainCopilot.ApiTests --configuration Release --no-build
      - name: Run Configuration tests
        run: dotnet run --project tests/DomainCopilot.ConfigurationTests --configuration Release --no-build
      - name: Audit NuGet packages
        run: dotnet list DomainCopilot.sln package --vulnerable --include-transitive

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t domain-copilot .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}